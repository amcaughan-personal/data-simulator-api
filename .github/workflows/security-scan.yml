name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deep_gitleaks:
        description: "Scan full git history with gitleaks (slower)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared-workflows/.github/workflows/security-scan.yml@b8d6eec5549f1cf8c41c594531f3febd7d059c8a # v2.4.0
    permissions:
      contents: read
      pull-requests: write
    with:
      scan_git_history: ${{ github.event_name == 'pull_request' || inputs.deep_gitleaks }}
