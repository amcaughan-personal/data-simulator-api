name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deep_gitleaks:
        description: "Scan full git history with gitleaks (slower)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared-workflows/.github/workflows/security-scan.yml@ca831e0767bee9dd04d13fb18444c69c689ade6f # v2.3.0
    permissions:
      contents: read
      pull-requests: write
    with:
      scan_git_history: ${{ github.event_name == 'pull_request' || inputs.deep_gitleaks }}
