name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deep_gitleaks:
        description: "Scan full git history with gitleaks (slower)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared_workflows/.github/workflows/security-scan.yml@20ba819e019f64a436091dac143d1dbd0d56715b
    permissions:
      contents: read
      pull-requests: write
    with:
      scan_git_history: ${{ github.event_name == 'pull_request' || inputs.deep_gitleaks }}
