name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deep_gitleaks:
        description: "Scan full git history with gitleaks (slower)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared_workflows/.github/workflows/security-scan.yml@48c9c6ceded2fa426ae14084a8998a263224c21e
    permissions:
      contents: read
      pull-requests: write
    with:
      scan_git_history: ${{ github.event_name == 'pull_request' || inputs.deep_gitleaks }}
