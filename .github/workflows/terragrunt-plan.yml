name: terragrunt-plan

# Plans every Terragrunt stack on pull requests that touch infrastructure, and comments
# the changes (addresses and types only; this repo is public). terragrunt-apply applies
# them after merging.

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".tool-versions"
      - ".github/workflows/terragrunt-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terragrunt-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    uses: amcaughan-personal/shared-workflows/.github/workflows/terragrunt-plan.yml@ca831e0767bee9dd04d13fb18444c69c689ade6f # v2.3.0
    with:
      aws_region: us-east-2
    secrets:
      aws_role_arn: ${{ secrets.PLAN_ROLE_ARN }}
