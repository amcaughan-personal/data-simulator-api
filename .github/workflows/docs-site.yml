name: docs-site

# Publishes the API reference (Swagger UI + openapi.json) to GitHub Pages.
# Pull requests only build it, to catch breakage; merges to main publish it.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build-docs-site.sh"
      - "scripts/docs-site/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build-docs-site.sh"
      - "scripts/docs-site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true # Python comes from .python-version

      - name: Build site
        run: |
          uv sync --locked
          ./scripts/build-docs-site.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
