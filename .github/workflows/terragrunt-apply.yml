name: terragrunt-apply

# Applies infrastructure from main: staging, then prod, which waits for approval in the
# infra-production environment. The staging job also plans prod, so the run's summary shows
# what prod will do before it's approved. A stack that would destroy or replace anything,
# or needs something CI's role can't do (see docs/aws.md), stops the run and is applied by
# hand. Output stays on the runner (this repo is public); the run's summary lists the
# changes by address and type.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".tool-versions"
  # Changes to this file alone (e.g. Dependabot bumping the shared workflow) don't apply
  # anything; run it by hand to try a change to it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    uses: amcaughan-personal/shared-workflows/.github/workflows/terragrunt-apply.yml@b8d6eec5549f1cf8c41c594531f3febd7d059c8a # v2.4.0
    permissions:
      contents: read
      id-token: write # to sign in to AWS as the apply role
    with:
      terragrunt_working_dir: infra/terragrunt/live/staging
      environment: infra-staging
      aws_region: us-east-2
      report_title: "Terragrunt apply: staging"
      # Plan prod read-only after staging applies, so its plan is in this run's summary
      # when the prod job asks for approval.
      preview_terragrunt_working_dir: infra/terragrunt/live/prod
      preview_title: "Prod plan (applies after approval)"
    secrets:
      aws_role_arn: ${{ secrets.APPLY_ROLE_ARN }}

  prod:
    needs: staging
    uses: amcaughan-personal/shared-workflows/.github/workflows/terragrunt-apply.yml@b8d6eec5549f1cf8c41c594531f3febd7d059c8a # v2.4.0
    permissions:
      contents: read
      id-token: write
    with:
      terragrunt_working_dir: infra/terragrunt/live/prod
      environment: infra-production
      aws_region: us-east-2
      report_title: "Terragrunt apply: prod"
    secrets:
      aws_role_arn: ${{ secrets.APPLY_ROLE_ARN }}
