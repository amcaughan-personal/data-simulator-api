name: deploy

# Every merge to main: build the package once, deploy it to staging and smoke-test it,
# then deploy the same package to production (after approval, if the production
# environment requires it) with a canary, and smoke-test again.
#
# Infrastructure (Terraform) is applied by hand; this only ships code. To roll back,
# re-run an earlier run of this workflow. Each environment's API_URL, DEPLOY_ROLE_ARN and
# FUNCTION_NAME are GitHub environment variables, published by the github-variables stack.

on:
  push:
    branches: [main]
    # Infrastructure is applied by hand, and docs change nothing deployed.
    paths-ignore: ["docs/**", "**/*.md", "infra/**"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: scripts/build-lambda.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-package
          path: dist/lambda.zip
          if-no-files-found: error

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.API_URL }}
    permissions:
      contents: read
      id-token: write # to sign in to AWS as this environment's deploy role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-package
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - run: scripts/deploy.sh "$FUNCTION_NAME" dist/lambda.zip
        env:
          FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
      - run: scripts/smoke-test.sh "$API_URL"
        env:
          API_URL: ${{ vars.API_URL }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-package
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - run: scripts/deploy.sh "$FUNCTION_NAME" dist/lambda.zip
        env:
          FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
      - run: scripts/smoke-test.sh "$API_URL"
        env:
          API_URL: ${{ vars.API_URL }}
