name: smoke-test

# Every 6 hours, runs the deploy workflow's smoke test against production, so a broken API
# is noticed even when nothing is being deployed. GitHub emails when a scheduled run fails.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The public URL from the README; a job in the production environment could read
      # vars.API_URL, but would record a "deployment" every 6 hours.
      - run: scripts/smoke-test.sh https://d1dfbd1pkurhz5.cloudfront.net
